name: Get Citation Data

on:
 workflow_dispatch:
 page_build:
 schedule:
  - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt

    - name: Run crawler
      working-directory: google_scholar_crawler
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python main.py

    - name: Push citation data
      working-directory: google_scholar_crawler/results
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add *.json
        git diff --cached --quiet && exit 0
        git commit -m "Updated Citation Data"
        git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
